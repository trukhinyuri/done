name: Create Release

on:
  push:
    tags:
      - '*.*'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag to package
        required: false

permissions:
  contents: write

jobs:
  mac:
    name: Package and Publish macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish || github.ref_name }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Set execute permission on build script
        run: chmod +x build.sh
      - name: Build macOS .app bundle and package
        id: package_mac
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        run: |
          ./build.sh --clean --app -v "$VERSION"
          zip -r Done-${VERSION}.app.zip bin/Done.app
          echo "app-file=Done-${VERSION}.app.zip" >> "$GITHUB_OUTPUT"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: ${{ steps.package_mac.outputs.app-file }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
