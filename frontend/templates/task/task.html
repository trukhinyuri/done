<div class="task"
     draggable="true"
     tabindex="0"
     role="article"
     data-uuid="$uuid;"
     data-body="$body;"
     data-timecreated="$timecreated;"
     data-timecompleted="$timecompleted;"
     data-duration_execution_estimated_seconds="$duration_execution_estimated_seconds;"
     data-duration_execution_real_seconds="$duration_execution_real_seconds;"
     data-time_hard_dead_line="$time_hard_dead_line;"
>
    <div class="task_visible" role="button" tabindex="0" aria-expanded="false">
        <div class="task_visible_number" aria-hidden="true"></div>
        <div class="task_visible_content">$body;</div>
        <div class="task_parameters_container">
            <div class="task_parameters task_visible_timeDeadline"><span>Due</span> $time_hard_dead_line_readable;</div>
            <div class="task_parameters task_visible_timeExcecutionEstimated"><span>Plan</span> $duration_execution_estimated_seconds_readable;</div>
            <div class="task_parameters task_visible_timeExcecutionReal"><span>Actual</span> $duration_execution_real_seconds_readable;</div>
        </div>
    </div>
    <div class="task_controls collapsed">
        <button type="button" class="taskButton taskStartButton"><span aria-hidden="true">▶</span> Start</button>
        <button type="button" class="taskButton taskStopButton"><span aria-hidden="true">■</span> Stop</button>
        <button type="button" class="taskButton taskChangeButton"><span aria-hidden="true">✎</span> Edit</button>
        <button type="button" class="taskButton taskCompletedButton"><span aria-hidden="true">✓</span> Done</button>
        <button type="button" class="taskButton taskMoveUpButton"><span aria-hidden="true">↑</span> Up</button>
        <button type="button" class="taskButton taskMoveDownButton"><span aria-hidden="true">↓</span> Down</button>
        <button type="button" class="taskButton taskRemoveButton"><span aria-hidden="true">×</span> Delete</button>
    </div>
</div>
